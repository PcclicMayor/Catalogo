<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pcclic Mayor - Repuestos Originales</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1d1d1f;
            --accent: #0071e3;
            --bg: #f5f5f7;
            --card-bg: #ffffff;
            --text-main: #1d1d1f;
            --text-secondary: #86868b;
            --border: #d2d2d7;
            --radius: 16px;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Poppins', sans-serif;
            margin: 0; padding: 0;
            overflow-x: hidden;
        }

        /* --- HEADER --- */
        header { 
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
            padding: 20px;
        }
        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }
        .brand-area { display: flex; align-items: center; gap: 15px; }
        .logo { max-width: 80px; height: auto; }
        
        /* Títulos Principales en BOLD */
        .titles h1 { 
            font-weight: 700; 
            font-size: 1.8rem; 
            margin: 0; 
            color: var(--primary); 
            line-height: 1.1; 
        }
        .titles .subtitle { font-size: 0.95rem; color: var(--text-secondary); font-weight: 500; }
        
        .contact-area { display: flex; gap: 10px; flex-wrap: wrap; }
        .contact-badge {
            background: var(--bg);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-weight: 600;
            border: 1px solid var(--border);
        }

        /* --- CONTROLES --- */
        .controls { max-width: 1200px; margin: 30px auto 10px; padding: 0 20px; }
        .brand-filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
        
        .filter-btn {
            padding: 10px 24px; border-radius: 25px; border: 1px solid var(--border);
            background: var(--card-bg); cursor: pointer; font-weight: 600; transition: 0.3s;
            font-family: 'Poppins', sans-serif;
        }
        .filter-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        .layout-container {
            display: flex;
            flex-direction: column;
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto 100px;
            padding: 0 20px;
        }
        @media (min-width: 900px) {
            .layout-container { flex-direction: row; align-items: flex-start; }
            .sidebar { width: 260px; flex-shrink: 0; position: sticky; top: 20px; }
            .main-content { flex-grow: 1; }
        }

        /* Categorías Estilo Lista en MEDIUM */
        .category-list {
            display: flex;
            flex-direction: column;
            gap: 5px;
            background: var(--card-bg);
            padding: 15px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
        }
        .sidebar-label {
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--text-secondary);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding-left: 10px;
        }
        .cat-list-item {
            padding: 12px 15px;
            border-radius: 10px;
            background: transparent;
            border: none;
            text-align: left;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500; /* MEDIUM */
            color: var(--text-main);
            transition: 0.2s;
            font-family: 'Poppins', sans-serif;
        }
        .cat-list-item:hover { background: var(--bg); }
        .cat-list-item.active { background: var(--primary); color: white; }

        input#search { 
            padding: 14px 25px; width: 100%; box-sizing: border-box;
            border-radius: 12px; border: 1px solid var(--border);
            font-size: 1rem; outline: none; margin-bottom: 25px;
            font-family: 'Poppins', sans-serif;
        }

        /* --- PRODUCTOS --- */
        .category-title { 
            font-size: 1.4rem; 
            font-weight: 700; /* BOLD */
            margin: 0 0 20px; 
            color: var(--primary);
        }
        
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 50px;
        }

        .card {
            background: var(--card-bg); border: 1px solid var(--border);
            border-radius: var(--radius); overflow: hidden; cursor: pointer;
            transition: 0.3s; display: flex; flex-direction: column;
        }
        .card:hover { transform: translateY(-5px); box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
        .card-img { height: 180px; padding: 15px; display: flex; justify-content: center; align-items: center; background: #fff; }
        .card-img img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .card-body { padding: 20px; border-top: 1px solid var(--border); }
        .card-title { font-size: 1rem; font-weight: 600; margin: 5px 0; }
        .card-price { font-size: 1.3rem; font-weight: 700; color: var(--primary); margin-bottom: 15px; }
        
        .btn-action {
            padding: 12px; border-radius: 10px; text-align: center; font-weight: 600;
            font-size: 0.85rem; cursor: pointer; text-decoration: none; border: none;
            width: 100%; margin-bottom: 8px; font-family: 'Poppins', sans-serif;
        }
        .btn-add { background: var(--bg); color: var(--primary); }
        .btn-ws { background: #25d366; color: white; }

        /* --- MODAL --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); display: none; justify-content: center;
            align-items: center; z-index: 1000; padding: 20px; backdrop-filter: blur(8px);
        }
        .modal-content {
            background: white; width: 100%; max-width: 850px; border-radius: 24px;
            display: flex; flex-direction: row; overflow: hidden; position: relative;
        }
        .modal-close {
            position: absolute; top: 15px; right: 15px; width: 35px; height: 35px;
            background: #f0f0f0; border-radius: 50%; display: flex; align-items: center;
            justify-content: center; cursor: pointer; z-index: 10;
        }
        .modal-left { flex: 1; padding: 30px; display: flex; align-items: center; justify-content: center; background: #fff; }
        .modal-left img { max-width: 100%; max-height: 350px; object-fit: contain; }
        .modal-right { flex: 1; padding: 40px; border-left: 1px solid var(--border); }

        @media (max-width: 750px) {
            .modal-content { flex-direction: column; max-height: 90vh; overflow-y: auto; }
            .modal-left { border-bottom: 1px solid var(--border); }
        }

        .color-chip { padding: 8px 16px; border: 1px solid var(--border); border-radius: 8px; cursor: pointer; font-size: 0.85rem; }
        .color-chip.active { background: var(--primary); color: white; border-color: var(--primary); }

        /* CARRITO FLOTANTE */
        .cart-float {
            position: fixed; bottom: 30px; right: 30px;
            background: var(--primary); color: white;
            padding: 15px 25px; border-radius: 35px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            display: none; align-items: center; gap: 12px;
            cursor: pointer; z-index: 900; font-weight: 700;
        }
        .cart-count { background: #ff3b30; color: white; border-radius: 50%; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; }
    </style>
</head>
<body>

    <header>
        <div class="header-content">
            <div class="brand-area">
                <img src="https://i.ibb.co/tRLTjLJ/Whats-App-Image-2026-03-26-at-11-08-01-AM.jpg" id="main-logo" alt="Logo" class="logo">
                <div class="titles">
                    <h1>Pcclic Mayor</h1>
                    <div class="subtitle">Repuestos Originales Apple, Samsung, Redmi</div>
                </div>
            </div>
            <div class="contact-area">
                <div class="contact-badge">📍 Barrio Obrero</div>
                <div class="contact-badge">📞 0424-7717071</div>
            </div>
        </div>
    </header>

    <div class="controls">
        <div class="brand-filters" id="brand-filters"></div>
    </div>

    <div class="layout-container">
        <aside class="sidebar">
            <div class="sidebar-label">Categorías</div>
            <div class="category-list" id="category-filters"></div>
        </aside>

        <main class="main-content">
            <input type="text" id="search" placeholder="Buscar modelo o repuesto...">
            <div id="catalogo">
                <div style="text-align:center; padding: 50px;">Cargando inventario profesional...</div>
            </div>
        </main>
    </div>

    <div class="cart-float" id="cart-btn" onclick="enviarPedido()">
        <span>🛒 Enviar Pedido a WhatsApp</span>
        <span class="cart-count" id="cart-count">0</span>
    </div>

    <div class="modal-overlay" id="modal" onclick="if(event.target == this) cerrarModal()">
        <div class="modal-content">
            <div class="modal-close" onclick="cerrarModal()">✕</div>
            <div class="modal-left"><img id="m-img" src=""></div>
            <div class="modal-right">
                <div id="m-brand" style="font-size: 0.75rem; font-weight: 700; color: var(--text-secondary); text-transform: uppercase;"></div>
                <h2 id="m-title" style="font-weight: 700; margin: 10px 0;"></h2>
                <div id="m-quality" style="color: var(--accent); font-weight: 600; margin-bottom: 15px; font-size: 0.9rem;"></div>
                <div id="m-price" style="font-size: 2rem; font-weight: 700; margin-bottom: 20px;"></div>
                <div style="font-weight: 600; margin-bottom: 10px; font-size: 0.85rem;">Seleccionar Color:</div>
                <div id="m-colors" style="display: flex; gap: 8px; margin-bottom: 30px; flex-wrap: wrap;"></div>
                <button id="m-add" class="btn-action btn-add" style="background: var(--primary); color: white;">Añadir al pedido 🛒</button>
            </div>
        </div>
    </div>

    <script>
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ-AIzMvX8IctXzBSuxHch1pILRjgbGcNhH7JuGWFc9O1sK67ZU_zGc0Z8g5B7TNbLysebuWsDrN7hT/pub?output=csv';
        const NUMERO_PEDIDO = '584247717071'; 
        
        let inventario = {}; 
        let marcaActual = '';
        let categoriaActual = 'TODAS';
        let pedido = [];

        function parseCSV(str) {
            const arr = []; let row = []; let cell = ''; let inQuotes = false;
            for (let i = 0; i < str.length; i++) {
                const char = str[i];
                if (char === '"' && str[i + 1] === '"') { cell += '"'; i++; } 
                else if (char === '"') { inQuotes = !inQuotes; } 
                else if (char === ',' && !inQuotes) { row.push(cell.trim()); cell = ''; } 
                else if (char === '\n' && !inQuotes) { row.push(cell.trim()); arr.push(row); row = []; cell = ''; } 
                else if (char !== '\r') { cell += char; } 
            }
            if (cell || row.length) { row.push(cell.trim()); arr.push(row); }
            return arr;
        }

        async function cargarDatos() {
            try {
                const r = await fetch(SHEET_URL);
                const d = await r.text();
                const filas = parseCSV(d);
                if(filas.length < 2) return;

                const h = filas[0].map(x => x.toLowerCase());
                const iM = h.findIndex(x => x.includes('marca')), iC = h.findIndex(x => x.includes('categor'));
                const iP = h.findIndex(x => x.includes('prod')), iCol = h.findIndex(x => x.includes('color'));
                const iCal = h.findIndex(x => x.includes('calid')), iPre = h.findIndex(x => x.includes('preci'));
                const iImg = h.findIndex(x => x.includes('imag')), iWs = h.findIndex(x => x.includes('whats'));

                inventario = {};
                const marcasSet = new Set();

                for (let i = 1; i < filas.length; i++) {
                    const f = filas[i];
                    if (!f[iM]) continue;
                    const m = f[iM], cat = f[iC] || 'Varios', prod = f[iP] || 'Producto', cal = f[iCal] || '';
                    marcasSet.add(m);
                    if (!inventario[m]) inventario[m] = {};
                    if (!inventario[m][cat]) inventario[m][cat] = {};
                    const key = `${prod}-${cal}`;
                    if (!inventario[m][cat][key]) inventario[m][cat][key] = { m, cat, prod, cal, variantes: [] };
                    inventario[m][cat][key].variantes.push({ color: f[iCol] || 'Único', precio: f[iPre] || 'S/P', img: f[iImg] || '', ws: f[iWs] || '' });
                }
                const mArr = Array.from(marcasSet);
                document.getElementById('brand-filters').innerHTML = mArr.map(m => `<button class="filter-btn" onclick="seleccionarMarca('${m}')">${m}</button>`).join('');
                if (mArr.length > 0) seleccionarMarca(mArr[0]);
            } catch (e) { console.log(e); }
        }

        function seleccionarMarca(m) {
            marcaActual = m; categoriaActual = 'TODAS';
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.innerText === m));
            const cats = Object.keys(inventario[m] || {});
            document.getElementById('category-filters').innerHTML = `<button class="cat-list-item active" onclick="filtrarCat('TODAS', this)">Ver Todo</button>` +
                cats.map(c => `<button class="cat-list-item" onclick="filtrarCat('${c}', this)">${c}</button>`).join('');
            renderCatalogo();
        }

        function filtrarCat(c, btn) {
            categoriaActual = c;
            document.querySelectorAll('.cat-list-item').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderCatalogo();
        }

        function renderCatalogo(q = '') {
            const container = document.getElementById('catalogo');
            container.innerHTML = '';
            const cats = inventario[marcaActual];
            if (!cats) return;
            q = q.toLowerCase();

            for (const [nomCat, prods] of Object.entries(cats)) {
                if (categoriaActual !== 'TODAS' && nomCat !== categoriaActual) continue;
                const fil = Object.values(prods).filter(p => p.prod.toLowerCase().includes(q));
                if (fil.length === 0) continue;

                container.innerHTML += `<div class="category-title">${nomCat}</div>`;
                const grid = document.createElement('div');
                grid.className = 'grid-container';

                fil.forEach((p, i) => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    const v = p.variantes[0];
                    const pData = encodeURIComponent(JSON.stringify(p));
                    card.innerHTML = `
                        <div class="card-img" onclick="verDetalle('${pData}')"><img src="${v.img}"></div>
                        <div class="card-body">
                            <div class="card-brand">${p.m}</div>
                            <div class="card-title">${p.prod}</div>
                            <div style="font-size:0.8rem; color:var(--text-secondary); margin-bottom:10px;">${p.cal}</div>
                            <div class="card-price">${v.precio}</div>
                            <button class="btn-action btn-add" onclick="sumarAlPedido('${nomCat}', '${p.prod}', '${p.cal}', '${v.color}', '${v.precio}')">Añadir al pedido 🛒</button>
                            <a href="https://wa.me/${v.ws}?text=Info de ${nomCat}: ${p.prod}" class="btn-action btn-ws" target="_blank">WhatsApp Directo</a>
                        </div>
                    `;
                    grid.appendChild(card);
                });
                container.appendChild(grid);
            }
        }

        window.sumarAlPedido = function(cat, prod, cal, col, pre) {
            pedido.push({ cat, prod, cal, col, pre });
            document.getElementById('cart-count').innerText = pedido.length;
            document.getElementById('cart-btn').style.display = 'flex';
            // Pequeño efecto visual al añadir
            const btn = document.getElementById('cart-btn');
            btn.style.transform = 'scale(1.1)';
            setTimeout(() => btn.style.transform = 'scale(1)', 200);
        }

        window.enviarPedido = function() {
            let msg = "Hola *Pcclic Mayor*, mi pedido es:\n\n";
            pedido.forEach((it, i) => {
                msg += `${i+1}. *[${it.cat.toUpperCase()}]* ${it.prod} (${it.cal})\n Color: ${it.col} | Precio: ${it.pre}\n\n`;
            });
            msg += "*Total de artículos:* " + pedido.length;
            window.open(`https://wa.me/${NUMERO_PEDIDO}?text=${encodeURIComponent(msg)}`, '_blank');
        }

        window.verDetalle = function(data) {
            const p = JSON.parse(decodeURIComponent(data));
            const m = document.getElementById('modal');
            document.getElementById('m-brand').innerText = p.m;
            document.getElementById('m-title').innerText = p.prod;
            document.getElementById('m-quality').innerText = p.cal;
            actualizarVarModal(p.variantes[0], p);
            document.getElementById('m-colors').innerHTML = p.variantes.map(v => 
                `<div class="color-chip" onclick="actualizarVarModal(${JSON.stringify(v).replace(/"/g, '&quot;')}, ${JSON.stringify(p).replace(/"/g, '&quot;')})">${v.color}</div>`).join('');
            m.style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        window.actualizarVarModal = function(v, p) {
            document.getElementById('m-img').src = v.img;
            document.getElementById('m-price').innerText = v.precio;
            document.getElementById('m-add').onclick = () => {
                sumarAlPedido(p.cat, p.prod, p.cal, v.color, v.precio);
                cerrarModal();
            };
        }

        window.cerrarModal = function() {
            document.getElementById('modal').style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        document.getElementById('search').oninput = (e) => renderCatalogo(e.target.value);
        cargarDatos();
    </script>
</body>
</html>
