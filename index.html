<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pcclic Mayor - Inventario Profesional</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1d1d1f;
            --accent: #0071e3;
            --bg: #f5f5f7;
            --card-bg: #ffffff;
            --text-main: #1d1d1f;
            --text-secondary: #86868b;
            --border: #d2d2d7;
            --radius: 18px;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Poppins', sans-serif;
            margin: 0; padding: 0;
            overflow-x: hidden;
        }

        /* --- HEADER MEJORADO --- */
        header { 
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            position: sticky; top: 0; z-index: 100;
            border-bottom: 1px solid var(--border);
            padding: 12px 20px;
        }
        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        .brand-block { display: flex; align-items: center; gap: 15px; }
        
        /* FIX LOGO: Más grande, sin recortes */
        .logo { 
            width: auto; 
            max-width: 150px; 
            height: 60px; 
            object-fit: contain; /* Evita que se corte */
        }
        
        .brand-info h1 { font-size: 1.25rem; margin: 0; font-weight: 700; }
        .title-row { display: flex; align-items: center; gap: 10px; }
        .subtitle { font-size: 0.8rem; color: var(--text-secondary); font-weight: 500; margin-top: 2px; }
        .status-dot { color: #25d366; font-weight: 700; font-size: 0.65rem; }

        .contact-header { display: flex; flex-direction: column; gap: 4px; max-width: 380px; }
        .contact-item { 
            font-size: 0.75rem; 
            color: var(--text-secondary); 
            display: flex; 
            align-items: flex-start; 
            gap: 6px;
            font-weight: 500;
            line-height: 1.3;
        }

        /* --- CONTROLES --- */
        .controls { max-width: 1200px; margin: 20px auto; padding: 0 20px; }
        .brand-filters { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; }
        .brand-filters::-webkit-scrollbar { display: none; }
        
        .filter-btn {
            padding: 8px 20px; border-radius: 20px; border: 1px solid var(--border);
            background: var(--card-bg); cursor: pointer; font-weight: 600; white-space: nowrap;
            transition: 0.3s; font-family: inherit;
        }
        .filter-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        /* --- LAYOUT Y SCROLL INDEPENDIENTE --- */
        .layout-container {
            display: flex; flex-direction: column; gap: 20px;
            max-width: 1200px; margin: 0 auto 100px; padding: 0 20px;
        }
        
        @media (min-width: 900px) {
            .layout-container { flex-direction: row; align-items: flex-start; }
            .sidebar { 
                width: 250px; flex-shrink: 0; position: sticky; 
                top: 100px; height: calc(100vh - 120px); 
                overflow-y: auto; padding-right: 10px;
            }
            .sidebar::-webkit-scrollbar { width: 4px; }
            .sidebar::-webkit-scrollbar-track { background: transparent; }
            .sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
            .main-content { flex-grow: 1; }
        }

        .category-list { display: flex; flex-direction: column; gap: 4px; padding-bottom: 30px; }
        .cat-list-item {
            padding: 10px 15px; border-radius: 12px; border: none;
            background: transparent; text-align: left; cursor: pointer;
            font-size: 0.9rem; font-weight: 500; transition: 0.2s;
        }
        .cat-list-item:hover { background: #e8e8ed; }
        .cat-list-item.active { background: var(--primary); color: white; }

        #search { 
            width: 100%; padding: 15px 25px; border-radius: 14px;
            border: 1px solid var(--border); font-size: 1rem;
            margin-bottom: 25px; box-sizing: border-box; outline: none;
            transition: 0.3s; font-family: 'Poppins', sans-serif;
        }

        /* --- GRID Y TARJETAS --- */
        .category-title { font-size: 1.3rem; font-weight: 700; margin: 30px 0 15px; display: flex; align-items: center; gap: 10px; }
        .category-title::after { content: ""; flex: 1; height: 1px; background: var(--border); }
        
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }

        .card {
            background: var(--card-bg); border-radius: var(--radius); 
            border: 1px solid var(--border); overflow: hidden; transition: 0.3s;
            display: flex; flex-direction: column;
        }
        .card:hover { transform: translateY(-5px); box-shadow: 0 15px 35px rgba(0,0,0,0.06); }
        
        .card-img { 
            height: 200px; background: #fff; display: flex; align-items: center; 
            justify-content: center; padding: 15px; position: relative; cursor: pointer;
        }
        .card-img img { max-width: 100%; max-height: 100%; object-fit: contain; }
        
        .colors-badge {
            position: absolute; bottom: 10px; right: 10px; background: rgba(0,0,0,0.6);
            color: white; font-size: 0.7rem; padding: 4px 8px; border-radius: 10px; font-weight: 600;
        }

        .card-body { padding: 20px; flex-grow: 1; display: flex; flex-direction: column; }
        .card-title { font-size: 0.95rem; font-weight: 600; margin-bottom: 5px; min-height: 2.8em; }
        .card-price { font-size: 1.4rem; font-weight: 700; color: var(--primary); margin-bottom: 15px; }

        .qty-selector {
            display: flex; align-items: center; justify-content: space-between;
            background: var(--bg); border-radius: 12px; padding: 6px 12px; margin-bottom: 15px;
        }
        .qty-btn { width: 32px; height: 32px; border-radius: 50%; border: none; background: #fff; cursor: pointer; font-weight: bold; }
        
        .btn-action {
            width: 100%; padding: 12px; border-radius: 12px; border: none;
            font-weight: 600; cursor: pointer; transition: 0.2s; font-family: inherit;
        }
        .btn-add { background: var(--primary); color: white; margin-bottom: 8px; }
        .btn-choose { background: white; color: var(--primary); border: 2px solid var(--primary); margin-bottom: 8px; }
        
        .btn-ver-mas {
            grid-column: 1 / -1; width: 100%; max-width: 250px; margin: 25px auto;
            padding: 12px; border: 2px solid var(--border); background: #fff;
            border-radius: 30px; font-weight: 600; cursor: pointer; color: var(--text-secondary);
        }

        /* --- CARRITO Y WHATSAPP FLOTANTE --- */
        .cart-float {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: var(--primary); color: white; padding: 15px 30px;
            border-radius: 40px; box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            display: none; align-items: center; gap: 15px; z-index: 1000; cursor: pointer;
        }
        .cart-badge { background: #ff3b30; padding: 2px 10px; border-radius: 10px; font-size: 0.8rem; }

        .wa-float {
            position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px;
            background-color: #25d366; color: white; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 10px 25px rgba(37,211,102,0.3); z-index: 999;
            transition: 0.3s; cursor: pointer; text-decoration: none;
        }
        .wa-float:hover { transform: scale(1.1); }
        
        @media (max-width: 700px) {
            .wa-float { width: 50px; height: 50px; bottom: 20px; right: 20px; }
            .wa-float svg { width: 28px; height: 28px; }
            .cart-float { bottom: 20px; left: 40%; }
        }

        /* --- MODAL Y COLORES --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(10px);
            display: none; justify-content: center; align-items: center; z-index: 2000;
        }
        .modal-content {
            background: #fff; width: 95%; max-width: 800px; border-radius: 30px;
            display: flex; flex-direction: row; overflow: hidden; position: relative;
        }
        .modal-close { position: absolute; top: 20px; right: 20px; font-size: 1.5rem; cursor: pointer; z-index: 10; }
        .modal-left { flex: 1; padding: 40px; background: #fff; display: flex; align-items: center; justify-content: center; }
        .modal-left img { max-width: 100%; max-height: 400px; object-fit: contain; transition: 0.3s; }
        .modal-right { flex: 1; padding: 40px; border-left: 1px solid var(--border); }
        
        .color-chip {
            padding: 8px 16px; border: 2px solid var(--border); border-radius: 12px; 
            cursor: pointer; font-size: 0.85rem; font-weight: 600; transition: 0.2s; background: white;
        }
        .color-chip.active { background: var(--primary); color: white; border-color: var(--primary); }

        @media (max-width: 700px) {
            .modal-content { flex-direction: column; height: 90vh; overflow-y: auto; }
            .modal-left { min-height: 250px; border-bottom: 1px solid var(--border); }
            .modal-right { border-left: none; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-content">
            <div class="brand-block">
                <!-- LOGO: Reemplaza el link por tu foto -->
                <img src="https://i.ibb.co/tRLTjLJ/Whats-App-Image-2026-03-26-at-11-08-01-AM.jpg" class="logo" alt="Pcclic">
                <div class="brand-info">
                    <div class="title-row">
                        <h1>Pcclic Mayor</h1>
                        <div class="status-dot">● ONLINE</div>
                    </div>
                    <div class="subtitle">Repuestos para iPhone, Samsung, Redmi y más!</div>
                </div>
            </div>
            <div class="contact-header">
                <div class="contact-item">📍 Barrio Obrero, Edf. Banco Activo, nivel 2. plaza los mangos.</div>
                <div class="contact-item">📱 0424-7717071</div>
            </div>
        </div>
    </header>

    <div class="controls">
        <div class="brand-filters" id="brand-filters"></div>
    </div>

    <div class="layout-container">
        <aside class="sidebar">
            <div style="font-size: 0.7rem; font-weight: 700; color: var(--text-secondary); margin-bottom: 12px; letter-spacing: 1px;">CATEGORÍAS</div>

        <main class="main-content">

    <!-- Carrito Flotante -->

        <span>🚀 Enviar Pedido</span>
        <span class="cart-badge" id="cart-count">0</span>
    </div>

    <!-- Botón directo WhatsApp Flotante -->
    <a href="https://wa.me/584247717071" class="wa-float" target="_blank" title="Chatear con nosotros">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg">
            <path d="M12.01 2.002c-5.514 0-10 4.486-10 10.001 0 1.764.453 3.424 1.252 4.898L2 21.998l5.244-1.214a9.96 9.96 0 0 0 4.766 1.215h.004c5.512 0 10-4.485 10-10.002 0-5.515-4.488-10-10-10zm0 16.326h-.003a8.318 8.318 0 0 1-4.22-1.144l-.304-.18-3.136.726.74-3.003-.198-.313a8.274 8.274 0 0 1-1.272-4.41c0-4.593 3.738-8.33 8.333-8.33 4.594 0 8.334 3.737 8.334 8.332-.001 4.593-3.74 8.322-8.333 8.322zm4.577-6.252c-.25-.125-1.488-.735-1.718-.819-.23-.084-.398-.125-.566.125-.167.25-.65 1.002-.797 1.209-.146.208-.293.234-.543.109-.25-.125-1.062-.392-2.022-1.25-.746-.667-1.25-1.492-1.396-1.742-.146-.25-.015-.385.11-.51.112-.112.25-.292.375-.438.125-.146.167-.25.25-.417.084-.167.042-.313-.021-.438-.063-.125-.566-1.365-.776-1.871-.203-.492-.41-.425-.566-.433-.146-.008-.313-.008-.48-.008s-.438.063-.667.313c-.23.25-.875.854-.875 2.083s.896 2.417 1.021 2.583c.125.167 1.761 2.688 4.261 3.766 1.7.734 2.372.825 3.23.696.953-.144 2.946-1.203 3.364-2.366.417-1.163.417-2.158.292-2.366-.125-.208-.458-.333-.708-.458z"/>
        </svg>
    </a>

    <div class="modal-overlay" id="modal" onclick="if(event.target == this) cerrarModal()">
        <div class="modal-content">
            <span class="modal-close" onclick="cerrarModal()">✕</span>
            <div class="modal-left"><img id="m-img" src=""></div>
            <div class="modal-right">
                <div id="m-brand" style="color: var(--accent); font-weight: 700; font-size: 0.8rem; text-transform: uppercase;"></div>
                <h2 id="m-title" style="margin: 5px 0 15px;"></h2>
                <div id="m-price" style="font-size: 2rem; font-weight: 700; margin-bottom: 20px;"></div>
                
                <div style="font-weight: 600; margin-bottom: 10px; font-size: 0.85rem;">Seleccionar Color/Variante:</div>
                <div id="m-colors" style="display: flex; gap: 8px; margin-bottom: 25px; flex-wrap: wrap;"></div>
                
                <div class="qty-selector">
                    <button class="qty-btn" onclick="changeQtyModal(-1)">-</button>
                    <span id="modal-qty" style="font-weight: 700;">1</span>
                    <button class="qty-btn" onclick="changeQtyModal(1)">+</button>
                </div>
                <button id="m-add" class="btn-action btn-add">Añadir al Pedido</button>
            </div>
        </div>
    </div>

    <script>
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ-AIzMvX8IctXzBSuxHch1pILRjgbGcNhH7JuGWFc9O1sK67ZU_zGc0Z8g5B7TNbLysebuWsDrN7hT/pub?output=csv';
        const WHATSAPP_NUMBER = '584247717071';
        
        let db = {}; 
        let currentBrand = '';
        let currentCat = 'TODAS';
        let cart = [];
        let modalProduct = null;
        let modalSelectedVariant = null;

        // Función robusta para leer el Excel (evita que las fotos se pierdan)
        function parseCSV(str) {
            const arr = []; let row = []; let cell = ''; let inQuotes = false;
            for (let i = 0; i < str.length; i++) {
                const char = str[i];
                if (char === '"' && str[i + 1] === '"') { cell += '"'; i++; } 
                else if (char === '"') { inQuotes = !inQuotes; } 
                else if (char === ',' && !inQuotes) { row.push(cell.trim()); cell = ''; } 
                else if (char === '\n' && !inQuotes) { row.push(cell.trim()); arr.push(row); row = []; cell = ''; } 
                else if (char !== '\r') { cell += char; } 
            }
            if (cell || row.length) { row.push(cell.trim()); arr.push(row); }
            return arr;
        }

        async function init() {
            try {
                const response = await fetch(SHEET_URL);
                const csvText = await response.text();
                const rows = parseCSV(csvText);
                
                if(rows.length < 2) return;

                // Encontrar las columnas automáticamente
                const header = rows[0].map(h => h.toLowerCase());
                const iM = header.findIndex(h => h.includes('marca'));
                const iC = header.findIndex(h => h.includes('categor'));
                const iP = header.findIndex(h => h.includes('prod'));
                const iCol = header.findIndex(h => h.includes('color'));
                const iCal = header.findIndex(h => h.includes('calid'));
                const iPre = header.findIndex(h => h.includes('preci'));
                const iImg = header.findIndex(h => h.includes('imag'));

                db = {};
                const brands = new Set();

                for (let i = 1; i < rows.length; i++) {
                    const row = rows[i];
                    if (!row || !row[iM]) continue; // Saltar filas vacías

                    const m = row[iM], c = row[iC] || 'Otros', p = row[iP] || 'Producto';
                    const col = row[iCol] || 'Único', cal = row[iCal] || '', pre = row[iPre] || '', img = row[iImg] || '';
                    
                    brands.add(m);
                    if (!db[m]) db[m] = {};
                    if (!db[m][c]) db[m][c] = {};
                    
                    // AGRUPAR POR NOMBRE Y CALIDAD (Para unir los colores)
                    const productKey = `${p} - ${cal}`;
                    
                    if (!db[m][c][productKey]) {
                        db[m][c][productKey] = { brand: m, cat: c, name: p, quality: cal, variants: [] };
                    }
                    
                    db[m][c][productKey].variants.push({ color: col, price: pre, img: img });
                }

                const brandContainer = document.getElementById('brand-filters');
                brandContainer.innerHTML = Array.from(brands).map(b => `<button class="filter-btn" onclick="setBrand('${b}')">${b}</button>`).join('');
                
                if (brands.size > 0) setBrand(Array.from(brands)[0]);
            } catch (err) { console.error("Error cargando base de datos", err); }
        }

        function setBrand(m) {
            currentBrand = m;
            currentCat = 'TODAS';
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.toggle('active', btn.innerText === m));
            
            const cats = Object.keys(db[m]);
            const catContainer = document.getElementById('category-filters');
            catContainer.innerHTML = `<button class="cat-list-item active" onclick="setCat('TODAS', this)">Ver Todo</button>` +
                cats.map(c => `<button class="cat-list-item" onclick="setCat('${c}', this)">${c}</button>`).join('');
            
            render();
        }

        function setCat(c, btn) {
            currentCat = c;
            document.querySelectorAll('.cat-list-item').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            render();
        }

        function render(searchQuery = '') {
            const container = document.getElementById('catalogo');
            container.innerHTML = '';
            const query = searchQuery.toLowerCase();
            
            if (!db[currentBrand]) return;

            for (const [catName, productsObj] of Object.entries(db[currentBrand])) {
                if (currentCat !== 'TODAS' && catName !== currentCat) continue;

                // Convertimos el objeto de productos agrupados en un array para filtrarlo
                const productsArray = Object.values(productsObj);
                const filtered = productsArray.filter(p => p.name.toLowerCase().includes(query) || catName.toLowerCase().includes(query));
                if (filtered.length === 0) continue;

                const safeCatId = catName.replace(/[^a-z0-9]/gi, '_'); 
                
                const section = document.createElement('div');
                section.innerHTML = `<div class="category-title">${catName}</div>`;
                const grid = document.createElement('div');
                grid.className = 'grid-container';

                filtered.forEach((p, idx) => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.classList.add(`group-${safeCatId}`);
                    
                    if (idx >= 3 && query === '') card.style.display = 'none'; 

                    const pId = `qty-${safeCatId}-${idx}`;
                    const defaultVariant = p.variants[0];
                    const hasMultipleColors = p.variants.length > 1;
                    
                    // JSON seguro para abrir el modal
                    const encodedData = encodeURIComponent(JSON.stringify(p));

                    let badgeHTML = hasMultipleColors ? `<div class="colors-badge">+${p.variants.length} Colores</div>` : '';
                    let buttonHTML = hasMultipleColors 
                        ? `<button class="btn-action btn-choose" onclick="openModal('${encodedData}')">Elegir Color 🎨</button>`
                        : `<button class="btn-action btn-add" onclick="addToCart('${p.name}', '${defaultVariant.price}', '${defaultVariant.color}', '${pId}', '${catName}')">Añadir al pedido 🛒</button>`;

                    card.innerHTML = `
                        <div class="card-img" onclick="openModal('${encodedData}')">
                            <img src="${defaultVariant.img}" loading="lazy">
                            ${badgeHTML}
                        </div>
                        <div class="card-body">
                            <div class="card-title">${p.name} <br><small style="color:var(--accent); font-weight:700;">${p.quality}</small></div>
                            <div class="card-price">${defaultVariant.price}</div>
                            <div class="qty-selector">
                                <button class="qty-btn" onclick="updateQty('${pId}', -1)">-</button>
                                <span id="${pId}" style="font-weight:700">1</span>
                                <button class="qty-btn" onclick="updateQty('${pId}', 1)">+</button>
                            </div>
                            ${buttonHTML}
                        </div>
                    `;
                    grid.appendChild(card);
                });

                section.appendChild(grid);
                
                if (filtered.length > 3 && query === '') {
                    const btn = document.createElement('button');
                    btn.className = 'btn-ver-mas';
                    btn.innerText = `Ver más ${catName}`;
                    btn.onclick = () => {
                        document.querySelectorAll(`.group-${safeCatId}`).forEach(c => c.style.display = 'flex');
                        btn.style.display = 'none';
                    };
                    section.appendChild(btn);
                }

                container.appendChild(section);
            }
        }

        function updateQty(id, delta) {
            const el = document.getElementById(id);
            let val = parseInt(el.innerText) + delta;
            if (val >= 1) el.innerText = val;
        }

        function addToCart(name, price, color, qtyId, cat) {
            const qty = qtyId ? parseInt(document.getElementById(qtyId).innerText) : parseInt(document.getElementById('modal-qty').innerText);
            const item = { name, price, color, qty, cat };
            const existing = cart.find(i => i.name === name && i.color === color);
            if (existing) existing.qty += qty; else cart.push(item);
            updateCartUI();
            if (qtyId) document.getElementById(qtyId).innerText = "1";
        }

        function updateCartUI() {
            const count = cart.reduce((acc, item) => acc + item.qty, 0);
            const btn = document.getElementById('cart-btn');
            document.getElementById('cart-count').innerText = count;
            btn.style.display = count > 0 ? 'flex' : 'none';
        }

        function enviarPedido() {
            let msg = "📦 *NUEVO PEDIDO MAYOREO*\n\n";
            cart.forEach(i => { msg += `• *${i.qty}x* ${i.name}\n  Color: ${i.color} | Precio: ${i.price}\n\n`; });
            msg += `*Total Piezas:* ${cart.reduce((acc, item) => acc + item.qty, 0)}\n\n¿Me confirman pedido?`;
            window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`);
        }

        // LÓGICA DEL MODAL PARA CAMBIO DE COLORES E IMÁGENES
        function openModal(data) {
            modalProduct = JSON.parse(decodeURIComponent(data));
            modalSelectedVariant = modalProduct.variants[0]; // Selecciona el primero por defecto
            
            document.getElementById('m-title').innerText = modalProduct.name + (modalProduct.quality ? ` (${modalProduct.quality})` : '');
            document.getElementById('m-brand').innerText = modalProduct.brand;
            document.getElementById('modal-qty').innerText = "1";
            
            renderModalVariants();
            document.getElementById('modal').style.display = 'flex';
        }

        function renderModalVariants() {
            // Actualiza imagen y precio según la variante seleccionada
            document.getElementById('m-img').src = modalSelectedVariant.img;
            document.getElementById('m-price').innerText = modalSelectedVariant.price;
            
            // Genera los botones de colores
            const colorsContainer = document.getElementById('m-colors');
            colorsContainer.innerHTML = modalProduct.variants.map((v, index) => {
                const isActive = (v.color === modalSelectedVariant.color) ? 'active' : '';
                return `<div class="color-chip ${isActive}" onclick="selectModalVariant(${index})">${v.color}</div>`;
            }).join('');

            // Actualiza la acción del botón añadir
            document.getElementById('m-add').onclick = () => { 
                addToCart(modalProduct.name, modalSelectedVariant.price, modalSelectedVariant.color, null, modalProduct.cat); 
                cerrarModal(); 
            };
        }

        function selectModalVariant(index) {
            modalSelectedVariant = modalProduct.variants[index];
            renderModalVariants(); // Refresca la imagen, precio y el color activo
        }

        function cerrarModal() { document.getElementById('modal').style.display = 'none'; }
        
        function changeQtyModal(delta) {
            const el = document.getElementById('modal-qty');
            let val = parseInt(el.innerText) + delta;
            if (val >= 1) el.innerText = val;
        }

        document.getElementById('search').addEventListener('input', (e) => render(e.target.value));
        init();
    </script>
</body>
</html>
