<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pcclic Mayor - Repuestos Originales</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1d1d1f;
            --accent: #0071e3;
            --bg: #f5f5f7;
            --card-bg: #ffffff;
            --text-main: #1d1d1f;
            --text-secondary: #86868b;
            --border: #d2d2d7;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
        }

        /* --- HEADER ACTUALIZADO --- */
        header { 
            text-align: center; 
            padding: 40px 20px 25px;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
        }
        .logo { max-width: 160px; margin-bottom: 15px; }
        h1 { font-weight: 700; font-size: 2.2rem; margin: 0; color: var(--primary); }
        .subtitle { font-size: 1.1rem; color: var(--text-secondary); margin-top: 5px; font-weight: 500; }
        
        .contact-info {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 15px;
            font-size: 0.95rem;
            color: var(--text-secondary);
            font-weight: 500;
        }
        .contact-info span { display: flex; align-items: center; gap: 5px; }
        @media (max-width: 600px) {
            .contact-info { flex-direction: column; gap: 8px; align-items: center; }
        }

        /* --- CONTROLES Y FILTROS --- */
        .controls { 
            max-width: 1200px; 
            margin: 30px auto 10px; 
            padding: 0 20px;
            text-align: center;
        }
        
        /* Marcas */
        .brand-filters {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }
        .filter-btn {
            padding: 10px 24px;
            border-radius: 25px;
            border: 1px solid var(--border);
            background: var(--card-bg);
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
            transition: 0.3s;
        }
        .filter-btn.active, .filter-btn:hover { background: var(--primary); color: white; border-color: var(--primary); }

        /* Categorías (Sub-menú) */
        .category-filters {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }
        .cat-btn {
            padding: 6px 16px;
            border-radius: 20px;
            background: #e8e8ed;
            color: var(--text-secondary);
            border: none;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: 0.3s;
        }
        .cat-btn.active, .cat-btn:hover { background: var(--text-secondary); color: white; }

        /* Buscador */
        input#search { 
            padding: 14px 25px; 
            width: 100%; 
            max-width: 600px;
            border-radius: 12px; 
            border: 1px solid var(--border);
            font-size: 1rem;
            outline: none;
            font-family: 'Poppins', sans-serif;
            margin-bottom: 20px;
        }
        input#search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0,113,227,0.1); }

        /* --- CATÁLOGO --- */
        #catalogo {
            max-width: 1200px;
            margin: 0 auto 100px;
            padding: 0 20px;
        }

        .category-title {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--primary);
            margin: 40px 0 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--border);
            text-transform: capitalize;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(1, 1fr);
            gap: 25px;
        }
        @media (min-width: 768px) { .grid-container { grid-template-columns: repeat(2, 1fr); } }
        @media (min-width: 1024px) { .grid-container { grid-template-columns: repeat(3, 1fr); } }

        /* Tarjetas */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.05); }

        .card-img {
            width: 100%;
            height: 250px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            box-sizing: border-box;
            border-bottom: 1px solid var(--border);
        }
        .card-img img { max-width: 100%; max-height: 100%; object-fit: contain; }

        .card-body { padding: 20px; display: flex; flex-direction: column; flex-grow: 1; }
        .card-brand { font-size: 0.75rem; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px; }
        .card-title { font-size: 1.1rem; font-weight: 600; margin: 5px 0; color: var(--primary); }
        .card-quality { font-size: 0.85rem; color: var(--accent); font-weight: 600; margin-bottom: 10px; }
        .card-price { font-size: 1.8rem; font-weight: 700; color: var(--primary); margin: 0 0 5px 0; }
        .card-desc { font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 15px; min-height: 20px; font-style: italic; }

        .color-title { font-size: 0.8rem; font-weight: 700; margin-bottom: 8px; color: var(--primary); }
        .color-options { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 20px; }
        .color-chip {
            padding: 6px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.8rem;
            cursor: pointer;
            font-weight: 500;
            background: white;
            transition: 0.2s;
        }
        .color-chip.active { border-color: var(--primary); background: var(--primary); color: white; }

        .btn-ws {
            margin-top: auto;
            display: block;
            background: #25d366;
            color: white;
            text-align: center;
            padding: 12px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.95rem;
            transition: background 0.3s;
        }
        .btn-ws:hover { background: #1da851; }

        /* Botón Ver Más */
        .btn-ver-mas {
            display: inline-block;
            margin-top: 25px;
            padding: 10px 30px;
            background: transparent;
            color: var(--accent);
            border: 2px solid var(--accent);
            border-radius: 25px;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-ver-mas:hover { background: var(--accent); color: white; }
    </style>
</head>
<body>

    <header>
        <img src="https://i.ibb.co/tRLTjLJ/Whats-App-Image-2026-03-26-at-11-08-01-AM.jpg" alt="Logo Pcclic Mayor" class="logo" onerror="this.style.display='none'">
        <h1>Pcclic Mayor</h1>
        <div class="subtitle">Repuestos Originales Apple, Samsung, Redmi</div>
        <div class="contact-info">
            <span>📍 Barrio Obrero, San Cristobal.</span>
            <span>📞 0424-7717071</span>
        </div>
    </header>

    <div class="controls">
        <div class="brand-filters" id="brand-filters"></div>
        <div class="category-filters" id="category-filters"></div>
        <input type="text" id="search" placeholder="Buscar modelo (ej: iPhone 13)...">
    </div>

    <div id="catalogo">
        <div style="text-align:center; padding: 50px;">Cargando inventario...</div>
    </div>

    <script>
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ-AIzMvX8IctXzBSuxHch1pILRjgbGcNhH7JuGWFc9O1sK67ZU_zGc0Z8g5B7TNbLysebuWsDrN7hT/pub?output=csv';
        
        let inventario = {}; 
        let marcaActual = '';
        let categoriaFiltroActual = 'TODAS';

        function parseCSV(str) {
            const arr = [];
            let row = [];
            let cell = '';
            let inQuotes = false;
            for (let i = 0; i < str.length; i++) {
                const char = str[i];
                if (char === '"' && str[i + 1] === '"') { cell += '"'; i++; } 
                else if (char === '"') { inQuotes = !inQuotes; } 
                else if (char === ',' && !inQuotes) { row.push(cell.trim()); cell = ''; } 
                else if (char === '\n' && !inQuotes) { row.push(cell.trim()); arr.push(row); row = []; cell = ''; } 
                else if (char !== '\r') { cell += char; } 
            }
            if (cell || row.length) { row.push(cell.trim()); arr.push(row); }
            return arr;
        }

        async function cargarDatos() {
            try {
                const response = await fetch(SHEET_URL);
                const data = await response.text();
                const filas = parseCSV(data);
                
                if(filas.length < 2) return;

                const encabezados = filas[0].map(e => e.toLowerCase());
                const iMarca = encabezados.findIndex(e => e.includes('marca'));
                const iCat = encabezados.findIndex(e => e.includes('categor')); 
                const iProd = encabezados.findIndex(e => e.includes('producto') || e.includes('nombre'));
                const iColor = encabezados.findIndex(e => e.includes('color'));
                const iCal = encabezados.findIndex(e => e.includes('calidad'));
                const iPrec = encabezados.findIndex(e => e.includes('precio'));
                const iDesc = encabezados.findIndex(e => e.includes('descrip') || e.includes('nota'));
                const iImg = encabezados.findIndex(e => e.includes('imag') || e.includes('link'));
                const iWs = encabezados.findIndex(e => e.includes('whats') || e.includes('numero'));

                inventario = {};
                const marcasSet = new Set();

                for (let i = 1; i < filas.length; i++) {
                    const fila = filas[i];
                    if (fila.length < 3 || !fila[iMarca]) continue;

                    const marca = fila[iMarca] || 'Otras Marcas';
                    const categoria = (iCat >= 0 && fila[iCat]) ? fila[iCat] : 'Repuestos Varios';
                    const producto = (iProd >= 0 && fila[iProd]) ? fila[iProd] : 'Producto sin nombre';
                    const calidad = (iCal >= 0) ? fila[iCal] : '';
                    
                    marcasSet.add(marca);

                    if (!inventario[marca]) inventario[marca] = {};
                    if (!inventario[marca][categoria]) inventario[marca][categoria] = {};
                    
                    const key = `${producto} - ${calidad}`;
                    if (!inventario[marca][categoria][key]) {
                        inventario[marca][categoria][key] = {
                            marca, categoria, producto, calidad, variantes: []
                        };
                    }

                    inventario[marca][categoria][key].variantes.push({
                        color: (iColor >= 0 && fila[iColor]) ? fila[iColor] : 'Único',
                        precio: (iPrec >= 0 && fila[iPrec]) ? fila[iPrec] : 'Consultar',
                        desc: (iDesc >= 0 && fila[iDesc]) ? fila[iDesc] : '',
                        img: (iImg >= 0 && fila[iImg]) ? fila[iImg] : '',
                        ws: (iWs >= 0 && fila[iWs]) ? fila[iWs] : ''
                    });
                }

                const marcasArray = Array.from(marcasSet);
                renderBotonesMarcas(marcasArray);
                
                if (marcasArray.length > 0) seleccionarMarca(marcasArray[0]);

            } catch (error) {
                console.error("Error al leer el Excel:", error);
            }
        }

        function renderBotonesMarcas(marcas) {
            const container = document.getElementById('brand-filters');
            container.innerHTML = '';
            marcas.forEach(m => {
                const btn = document.createElement('button');
                btn.className = 'filter-btn';
                btn.innerText = m;
                btn.onclick = () => seleccionarMarca(m);
                container.appendChild(btn);
            });
        }

        function seleccionarMarca(marca) {
            marcaActual = marca;
            categoriaFiltroActual = 'TODAS'; // Reiniciar categoría al cambiar de marca
            
            document.querySelectorAll('.filter-btn').forEach(b => {
                b.classList.toggle('active', b.innerText === marca);
            });
            document.getElementById('search').value = '';

            renderBotonesCategorias();
            renderCatalogo();
        }

        function renderBotonesCategorias() {
            const container = document.getElementById('category-filters');
            container.innerHTML = '';
            
            if(!inventario[marcaActual]) return;

            const categorias = Object.keys(inventario[marcaActual]);
            
            // Botón "Todas"
            const btnTodas = document.createElement('button');
            btnTodas.className = 'cat-btn active';
            btnTodas.innerText = 'Todas';
            btnTodas.onclick = (e) => seleccionarCategoria('TODAS', e.target);
            container.appendChild(btnTodas);

            // Botones por categoría
            categorias.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = 'cat-btn';
                btn.innerText = cat;
                btn.onclick = (e) => seleccionarCategoria(cat, e.target);
                container.appendChild(btn);
            });
        }

        function seleccionarCategoria(cat, btnElement) {
            categoriaFiltroActual = cat;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btnElement.classList.add('active');
            renderCatalogo();
        }

        function renderCatalogo(terminoBusqueda = '') {
            const container = document.getElementById('catalogo');
            container.innerHTML = '';

            const categorias = inventario[marcaActual];
            if (!categorias) return;

            terminoBusqueda = terminoBusqueda.toLowerCase();
            const limiteTarjetas = 3;

            for (const [nombreCategoria, productosKey] of Object.entries(categorias)) {
                
                // Si hay un filtro de categoría activo y no es esta, la saltamos
                if (categoriaFiltroActual !== 'TODAS' && nombreCategoria !== categoriaFiltroActual) continue;

                const productosFiltrados = Object.values(productosKey).filter(p => 
                    p.producto.toLowerCase().includes(terminoBusqueda)
                );

                if (productosFiltrados.length === 0) continue;

                // Título
                const catTitle = document.createElement('div');
                catTitle.className = 'category-title';
                catTitle.innerText = nombreCategoria;
                container.appendChild(catTitle);

                // Grid
                const grid = document.createElement('div');
                grid.className = 'grid-container';
                const claseOcultos = `oculto-${nombreCategoria.replace(/[^a-zA-Z0-9]/g, '')}`;

                productosFiltrados.forEach((p, indexProd) => {
                    const uid = `${nombreCategoria.replace(/[^a-zA-Z0-9]/g, '')}-${indexProd}`;
                    const varInicial = p.variantes[0];
                    const card = document.createElement('div');
                    card.className = 'card';

                    // Lógica para ocultar los que pasan de 3 (solo si no hay búsqueda activa)
                    if (indexProd >= limiteTarjetas && terminoBusqueda === '') {
                        card.style.display = 'none';
                        card.classList.add(claseOcultos);
                    }

                    const variantesJSON = encodeURIComponent(JSON.stringify(p.variantes));

                    card.innerHTML = `
                        <div class="card-img">
                            <img src="${varInicial.img}" id="img-${uid}" onerror="this.src='https://via.placeholder.com/300?text=Pcclic+Mayor'">
                        </div>
                        <div class="card-body">
                            <div class="card-brand">${p.marca}</div>
                            <h3 class="card-title">${p.producto}</h3>
                            <div class="card-quality">${p.calidad}</div>
                            <div class="card-price" id="price-${uid}">${varInicial.precio}</div>
                            <div class="card-desc" id="desc-${uid}">${varInicial.desc}</div>
                            <div class="color-title">Color disponible:</div>
                            <div class="color-options">
                                ${p.variantes.map((v, i) => `
                                    <div class="color-chip ${i === 0 ? 'active' : ''}" 
                                         onclick="cambiarVariante(this, '${uid}', '${variantesJSON}', ${i}, '${p.producto}')">${v.color}</div>
                                `).join('')}
                            </div>
                            <a href="https://wa.me/${varInicial.ws}?text=Hola Pcclic Mayor, me interesa: ${p.producto} (Color: ${varInicial.color})" 
                               class="btn-ws" id="ws-${uid}" target="_blank">Pedir por WhatsApp</a>
                        </div>
                    `;
                    grid.appendChild(card);
                });

                container.appendChild(grid);

                // Botón "Ver más" si hay más de 3 productos y no se está buscando
                if (productosFiltrados.length > limiteTarjetas && terminoBusqueda === '') {
                    const contBtn = document.createElement('div');
                    contBtn.style.textAlign = 'center';
                    
                    const btnVerMas = document.createElement('button');
                    btnVerMas.className = 'btn-ver-mas';
                    btnVerMas.innerText = `Ver más ${nombreCategoria.toLowerCase()}`;
                    
                    btnVerMas.onclick = () => {
                        document.querySelectorAll(`.${claseOcultos}`).forEach(c => c.style.display = 'flex');
                        btnVerMas.style.display = 'none';
                    };
                    
                    contBtn.appendChild(btnVerMas);
                    container.appendChild(contBtn);
                }
            }
        }

        window.cambiarVariante = function(elementoHtml, uid, variantesJSON, indexVariante, nombreProducto) {
            const chips = elementoHtml.parentElement.querySelectorAll('.color-chip');
            chips.forEach(c => c.classList.remove('active'));
            elementoHtml.classList.add('active');

            const variantes = JSON.parse(decodeURIComponent(variantesJSON));
            const varElegida = variantes[indexVariante];

            document.getElementById(`price-${uid}`).innerText = varElegida.precio;
            document.getElementById(`img-${uid}`).src = varElegida.img;
            document.getElementById(`desc-${uid}`).innerText = varElegida.desc;
            document.getElementById(`ws-${uid}`).href = `https://wa.me/${varElegida.ws}?text=Hola Pcclic Mayor, me interesa: ${nombreProducto} (Color: ${varElegida.color})`;
        };

        document.getElementById('search').addEventListener('input', (e) => {
            renderCatalogo(e.target.value);
        });

        cargarDatos();
    </script>
</body>
</html>
